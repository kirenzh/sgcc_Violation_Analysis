<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>违章分析智能助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      overflow-y: auto;
      padding: 16px 12px 90px;
    }
    .message {
      margin: 12px 0;
    }
    .user-box {
      text-align: right;
    }
    .user-text {
      background: #1677ff;
      color: #fff;
      padding: 11px 15px;
      border-radius: 14px 4px 14px 14px;
      display: inline-block;
      max-width: 86%;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .agent-box {
      text-align: left;
    }
    .agent-text {
      background: #ffffff;
      padding: 11px 15px;
      border-radius: 4px 14px 14px 14px;
      display: inline-block;
      max-width: 86%;
      box-shadow: 0 1px 4px #e4e7ed;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .send-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 14px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      gap: 10px;
    }
    #query-input {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid #ddd;
      border-radius: 22px;
      font-size: 16px;
      outline: none;
    }
    #send-btn {
      padding: 11px 22px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="chat-container" id="chatBox"></div>
<div class="send-bar">
  <input id="query-input" placeholder="输入问题发送">
  <button id="send-btn">发送</button>
</div>

<script>
const API_PROXY = "/api/proxy";

const chatBox = document.getElementById("chatBox");
const inputEl = document.getElementById("query-input");
const sendBtn = document.getElementById("send-btn");

function addMsg(content, isUser) {
  const wrap = document.createElement("div");
  wrap.className = isUser ? "message user-box" : "message agent-box";
  wrap.innerHTML = `<div class="${isUser ? "user-text" : "agent-text"}">${content}</div>`;
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return wrap.querySelector("div");
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMsg(text, true);
  inputEl.value = "";
  const replyDom = addMsg("", false);
  let fullText = "";

  try {
    const resp = await fetch(`${API_PROXY}?query=${encodeURIComponent(text)}`);
    if (!resp.ok) {
      replyDom.innerText = "服务异常";
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith("data:")) {
          let data = line.replace("data:", "").trim();
          if (data === "[DONE]") continue;
          fullText += data;
          replyDom.innerText = fullText;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }
    }
  } catch (e) {
    replyDom.innerText = "请求失败";
  }
}

sendBtn.onclick = sendMessage;
inputEl.onkeydown = e => e.key === "Enter" && sendMessage();
</script>
</body>
</html>
