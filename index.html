<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      overflow-y: auto;
      padding: 16px 12px 90px;
    }
    .message {
      margin: 12px 0;
    }
    .user-box {
      text-align: right;
    }
    .user-text {
      background: #1677ff;
      color: #fff;
      padding: 11px 15px;
      border-radius: 14px 4px 14px 14px;
      display: inline-block;
      max-width: 86%;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .agent-box {
      text-align: left;
    }
    .agent-text {
      background: #ffffff;
      padding: 11px 15px;
      border-radius: 4px 14px 14px 14px;
      display: inline-block;
      max-width: 86%;
      box-shadow: 0 1px 4px #e4e7ed;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .send-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 14px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      gap: 10px;
    }
    #query-input {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid #ddd;
      border-radius: 22px;
      font-size: 16px;
      outline: none;
    }
    #send-btn {
      padding: 11px 22px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="chat-container" id="chatBox"></div>
<div class="send-bar">
  <input id="query-input" placeholder="输入问题发送">
  <button id="send-btn">发送</button>
</div>

<script>
// ============ 在这里填入你的信息 ============
const HOST = "https://poweragents.agentspro.cn";
const UUID = "8f3408d12c314e38848242a0825a382b";
const AUTH_KEY = "8f3408d12c314e38848242a0825a382b";
const AUTH_SECRET = "z8TXLMTEy0rKBzTEiFiTmlQUroadIrg8";
// ============================================

const chatBox = document.getElementById("chatBox");
const inputEl = document.getElementById("query-input");
const sendBtn = document.getElementById("send-btn");

// 渲染消息
function addMsg(content, isUser) {
  const wrap = document.createElement("div");
  wrap.className = isUser ? "message user-box" : "message agent-box";
  wrap.innerHTML = `<div class="${isUser ? "user-text" : "agent-text"}">${content}</div>`;
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return wrap.querySelector("div");
}

// 发送对话
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMsg(text, true);
  inputEl.value = "";
  const replyDom = addMsg("", false);
  let fullText = "";

  // 拼装请求地址，带上鉴权参数
  const params = new URLSearchParams({
    uuid: UUID,
    auth_key: AUTH_KEY,
    auth_secret: AUTH_SECRET,
    query: text
  });

  const resp = await fetch(`${HOST}/stream?${params.toString()}`, {
    method: "GET",
    headers: {
      "Accept": "text/event-stream"
    }
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder("utf-8");

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split("\n");
    for (const line of lines) {
      if (line.startsWith("data: ") && line !== "data: [DONE]") {
        fullText += line.replace("data: ", "");
        replyDom.innerText = fullText;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  }
}

sendBtn.onclick = sendMessage;
// 回车发送
inputEl.onkeydown = e => {
  if (e.key === "Enter") sendMessage();
};
</script>
</body>
</html>
